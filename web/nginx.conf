server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web is a single-page app: fall back to index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the files that decide which app version the browser runs
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-cache";
    }

    # Engine + fonts + images only change with a Flutter upgrade or new deploy;
    # let browsers keep them for a day and revalidate cheaply after that
    location ~* \.(wasm|png|ico|ttf|otf|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri /index.html;
    }

    # Serve the .gz files produced at image build time; fall back to
    # on-the-fly compression for anything not precompressed
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml font/ttf font/otf;
}
